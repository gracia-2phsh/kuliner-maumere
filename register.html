<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar & Login - Maumere Delivery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef7fc;
            margin: 0;
            padding: 15px;
            color: #1e293b;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.08);
            box-sizing: border-box;
        }
        h2 {
            color: #0284c7;
            text-align: center;
            margin-top: 0;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #bae6fd;
            background: #f0f9ff;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .role-btn.active {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
        }
        .btn-submit {
            background: #fef08a;
            color: #1e293b;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Registrasi & Login</h2>
    <p style="text-align: center; font-size: 12px; color: #64748b; margin-bottom: 15px;">Pilih jenis akun yang ingin Anda kembangkan:</p>

    <!-- Tombol Pemilihan Peran -->
    <div class="role-selector">
        <div class="role-btn active" id="btnRolePembeli" onclick="pilihRole('pembeli')">🛒 Akun Pembeli</div>
        <div class="role-btn" id="btnRolePenjual" onclick="pilihRole('penjual')">🏪 Akun Penjual (Toko)</div>
    </div>

    <form onsubmit="prosesPendaftaran(event)">
        <div class="form-group">
            <label id="labelNama">Nama Lengkap Pembeli:</label>
            <input type="text" id="namaUser" required placeholder="Contoh: Gracia D'Franco">
        </div>
        <div class="form-group">
            <label>Alamat Email:</label>
            <input type="email" id="emailUser" required placeholder="email@domain.com">
        </div>
        <div class="form-group">
            <label>Nomor HP / WhatsApp:</label>
            <input type="tel" id="noHpUser" required placeholder="08123456789">
        </div>
        <div class="form-group">
            <label id="labelAlamat">Alamat Lengkap di Maumere:</label>
            <textarea id="alamatUser" required placeholder="Jl. El Tari No. 10, Maumere"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnTextSubmit">Masuk ke Beranda Pembeli ➔</button>
    </form>
</div>

<script>
    let rolePilihan = 'pembeli';

    function pilihRole(role) {
        rolePilihan = role;
        document.getElementById('btnRolePembeli').classList.remove('active');
        document.getElementById('btnRolePenjual').classList.remove('active');

        if (role === 'pembeli') {
            document.getElementById('btnRolePembeli').classList.add('active');
            document.getElementById('labelNama').innerText = "Nama Lengkap Pembeli:";
            document.getElementById('labelAlamat').innerText = "Alamat Lengkap di Maumere:";
            document.getElementById('btnTextSubmit').innerText = "Masuk ke Beranda Pembeli ➔";
        } else {
            document.getElementById('btnRolePenjual').classList.add('active');
            document.getElementById('labelNama').innerText = "Nama Toko / Usaha Kuliner:";
            document.getElementById('labelAlamat').innerText = "Alamat Lokasi Toko di Maumere:";
            document.getElementById('btnTextSubmit').innerText = "Buka Dashboard Penjual ➔";
        }
    }

    function prosesPendaftaran(e) {
        e.preventDefault();

        const userObj = {
            nama: document.getElementById('namaUser').value,
            email: document.getElementById('emailUser').value,
            noHp: document.getElementById('noHpUser').value,
            alamat: document.getElementById('alamatUser').value,
            role: rolePilihan
        };

        // Simpan data akun ke localStorage
        localStorage.setItem('userTerdaftar', JSON.stringify(userObj));

        // Pengalihan halaman sesuai role yang dipilih
        if (rolePilihan === 'penjual') {
            alert("Selamat! Toko Anda berhasil terdaftar. Mengarahkan ke Dashboard Penjual...");
            window.location.href = 'dashboard_penjual.html';
        } else {
            alert("Registrasi Berhasil! Selamat berbelanja kuliner di Maumere.");
            window.location.href = 'index.html';
        }
    }
</script>

</body>
</html>
